services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noteshpere-postgres-build
    environment:
      POSTGRES_DB: noteshpere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - noteshpere_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noteshpere"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  noteshpere_pg_data: